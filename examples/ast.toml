[core]
architecture = "x86_64"
channel = "stable"

[packages]
allow_untested = true
prefer_binary = false
compression = "zstd"

[build]
enabled = true
jobs = 4
directory = "/var/cache/ast/build"
sandbox = "required"   # required, auto or none

[security]
verify_signatures = true
verify_checksums = true
