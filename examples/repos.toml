# Repositories (/etc/ast/repos.toml): one table per repository, named like it.
# A repository is used when it is enabled and its channel is the system channel;
# a higher priority wins.

[ast]
url = "https://raw.githubusercontent.com/ast-os/ast-repo/main/x86_64/stable"
enabled = true
priority = 100
key = "asteros.pub"
channel = "stable"

[ast-edge]
url = "https://raw.githubusercontent.com/ast-os/ast-repo/main/x86_64/edge"
enabled = false
priority = 100
key = "asteros.pub"
channel = "edge"
